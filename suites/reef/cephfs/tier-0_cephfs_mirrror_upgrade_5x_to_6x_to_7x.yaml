---
tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true
  - test:
      abort-on-fail: true
      clusters:
        ceph1:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    rhcs-version: 5.3
                    release: released
                    orphan-initial-daemons: true
                    skip-monitoring-stack: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  command: shell
                  args:
                    - ceph fs volume create cephfs
              - config:
                  command: apply
                  service: mds
                  base_cmd_args:
                    verbose: true
                  pos_args:
                    - cephfs
                  args:
                    placement:
                      nodes:
                        - node4
                        - node5
              - config:
                  command: apply
                  service: cephfs-mirror
                  args:
                    placement:
                      nodes:
                        - node6
        ceph2:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    rhcs-version: 5.3
                    release: released
                    orphan-initial-daemons: true
                    skip-monitoring-stack: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  command: shell
                  args:
                    - ceph fs volume create cephfs
              - config:
                  command: apply
                  service: mds
                  base_cmd_args:
                    verbose: true
                  pos_args:
                    - cephfs
                  args:
                    placement:
                      nodes:
                        - node4
                        - node5
      desc: CephFS Mirror cluster deployment using cephadm
      destroy-clster: false
      module: test_cephadm.py
      polarion-id: CEPH-83574114
      name: deploy cephfs-mirror
  - test:
      abort-on-fail: true
      clusters:
        ceph1:
          config:
            command: add
            copy_admin_keyring: true
            id: client.1
            install_packages:
              - ceph-common
              - ceph-fuse
            node: node7
        ceph2:
          config:
            command: add
            copy_admin_keyring: true
            id: client.1
            install_packages:
              - ceph-common
              - ceph-fuse
            node: node6
      desc: Configure the Cephfs client system 1
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      name: Enable logging to file
      module: rados_prep.py
      config:
        log_to_file: true
      desc: Change config options to enable logging to file

  - test:
      abort-on-fail: true
      desc: Configure CephFS Mirroring
      clusters:
        ceph1:
          config:
            name: Validate the Synchronisation is successful upon enabling fs mirroring
      module: cephfs_mirror_upgrade.configure_cephfs_mirroring.py
      name: Validate the Synchronisation is successful upon enabling fs mirroring.
      polarion-id: CEPH-83574099

  - test:
      name: Upgrade along with IOs
      module: test_parallel.py
      parallel:
        - test:
            abort-on-fail: false
            config:
              client_upgrade: 1
              client_upgrade_node: 'node7'
            desc: Runs IOs in parallel with upgrade process
            module: cephfs_upgrade.cephfs_io.py
            name: "creation of Prerequisites for Upgrade"
            polarion-id: CEPH-83575315
        - test:
            name: Upgrade ceph
            desc: Upgrade cluster to released 6.1
            module: cephadm.test_cephadm_upgrade.py
            polarion-id: CEPH-83574638
            clusters:
              ceph1:
                config:
                  command: start
                  service: upgrade
                  base_cmd_args:
                    verbose: true
                  args:
                    rhcs-version: 6.1  #Need change in version when there is minor version change
                    release: released
                  benchmark:
                    type: rados
                    pool_per_client: true
                    pg_num: 128
                    duration: 10
                  verify_cluster_health: false
            destroy-cluster: false
      desc: Running upgrade, mds Failure and i/o's parallelly
      abort-on-fail: false

  - test:
      abort-on-fail: false
      desc: Validate the Synchronisation is successful upon upgrade of primary cluster
      clusters:
        ceph1:
          config:
            name: Validate the Synchronisation is successful upon upgrade of primary cluster
            clean_up: false
      module: cephfs_mirror_upgrade.post_upgrade_validate.py
      name: Validate the Synchronisation is successful upon upgrade.
      polarion-id: CEPH-83575336

  - test:
      name: Upgrade along with IOs
      module: test_parallel.py
      parallel:
        - test:
            abort-on-fail: false
            config:
              client_upgrade: 1
              client_upgrade_node: 'node7'
            desc: Runs IOs in parallel with upgrade process
            module: cephfs_upgrade.cephfs_io.py
            name: "creation of Prerequisites for Upgrade"
            polarion-id: CEPH-83575315
        - test:
            name: Upgrade ceph
            desc: Upgrade cluster to latest version 7.1
            module: cephadm.test_cephadm_upgrade.py
            polarion-id: CEPH-83574638
            clusters:
              ceph1:
                config:
                  command: start
                  service: upgrade
                  base_cmd_args:
                    verbose: true
                  args:
                    rhcs-version: 7.1
                    release: latest
                  benchmark:
                    type: rados
                    pool_per_client: true
                    pg_num: 128
                    duration: 10
                  verify_cluster_health: false
            destroy-cluster: false
      desc: Running upgrade, mds Failure and i/o's parallelly
      abort-on-fail: false

  # CephX post-upgrade on ceph1 only after hop 2:
  #   1) dnf update client RPMs on ceph1 clients
  #   2) rotate client.admin (aes256k), rewrite admin keyring on installer+clients
  #   3) rotate mount client; umount/remount kernel+fuse from variables.pkl (FS-root);
  #      printf/cat probe at the same pickle paths for later post_upgrade_validate
  - test:
      name: CephFS CephX key rotation post-upgrade
      module: cephfs_upgrade.test_cephfs_cephx_post_upgrade_key_rotation.py
      desc: "ceph1 after hop 2: client RPM update; rotate client.admin + mount clients; FS-root remount from pickle with probe."
      polarion-id: CEPH-xxxxx
      abort-on-fail: true
      clusters:
        ceph1:
          config:
            mirror_pickle: true

  - test:
      abort-on-fail: false
      desc: Validate the Synchronisation is successful upon upgrade of second cluster
      clusters:
        ceph1:
          config:
            name: Validate the Synchronisation is successful upon upgrade of second cluster
            clean_up: true
      module: cephfs_mirror_upgrade.post_upgrade_validate.py
      name: Validate the Synchronisation is successful upon upgrade.
      polarion-id: CEPH-83575336

