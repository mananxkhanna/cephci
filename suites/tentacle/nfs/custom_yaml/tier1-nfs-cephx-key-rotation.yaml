#===============================================================================================
#-------------------------------------
#--- NFS Ganesha CephX key rotation ---
#-------------------------------------
# Conf: conf/tentacle/nfs/1admin-7node-3client.yaml
# Single-test suite for:
#    - ceph nfs cluster rotate-key (IBMCEPH-16471 live-mount path)
#    - rotate-key must return JSON, not NameError EINVAL (IBMCEPH-18228)
# Configure only client.1 (node4). Conf still defines node5-7; they are unused.
#
# Polarion: CEPH-83632951
#===============================================================================================
tests:
  - test:
      abort-on-fail: true
      desc: Install software pre-requisites for cluster deployment.
      module: install_prereq.py
      name: setup pre-requisites

  - test:
      abort-on-fail: true
      config:
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
          - config:
              args:
                - "ceph osd pool create rbd"
              command: shell
          - config:
              args:
                - "rbd pool init rbd"
              command: shell
      desc: bootstrap and deploy services.
      destroy-cluster: false
      polarion-id: CEPH-83573713
      module: test_cephadm.py
      name: Deploy cluster using cephadm

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      desc: Configure the RGW,RBD client system
      destroy-cluster: false
      module: test_client.py
      name: configure client

  - test:
      name: NFS CephX key rotation ceph nfs cluster rotate key
      module: test_nfs_cephx_key_rotation.py
      desc: NFS export stays mounted post nfs cluster key rotate
      polarion-id: CEPH-83632951
      abort-on-fail: false
      config:
        nfs_version: 4.1
        clients: 1
        nfs_name: cephfs-nfs-cephx
